# ALMOVA: staging (homologação) and production stack.
#
# Every image is pinned by version and digest; the two images of the app are
# built from this repository. Copy homolog.env.example to homolog.env (or
# production.env) and fill it in; see README.md.
name: almova

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-server: &server
  image: almova/server:${ALMOVA_TAG:-homolog}
  build:
    context: ../../..
    dockerfile: extras/docker/production/Dockerfile
  env_file: ${ALMOVA_ENV_FILE:-homolog.env}
  logging: *logging
  restart: unless-stopped

services:
  db:
    image: docker.io/postgres:18.7-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
    env_file: ${ALMOVA_ENV_FILE:-homolog.env}
    shm_size: 256mb
    # From PostgreSQL 18 on, the image keeps the data below /var/lib/postgresql/<version>
    volumes:
      - postgres-data:/var/lib/postgresql
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=768MB",
      "-c", "work_mem=8MB",
      "-c", "random_page_cost=1.1",
      "-c", "max_connections=60"
    ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  cache:
    image: docker.io/redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging
    restart: unless-stopped

  # Virus scan of uploads (CLAMAV_HOST=clamav). Downloads its signatures on start
  clamav:
    image: docker.io/clamav/clamav:1.5.4@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
    logging: *logging
    restart: unless-stopped

  web:
    <<: *server
    volumes:
      - static:/home/wger/static
      - media:/home/wger/media
      - private-media:/home/wger/private-media
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8000/api/v2/version/"]
      interval: 10s
      timeout: 5s
      start_period: 300s
      retries: 5

  celery_worker:
    <<: *server
    command: /start-worker
    volumes:
      - media:/home/wger/media
      - private-media:/home/wger/private-media
    depends_on:
      web:
        condition: service_healthy

  celery_beat:
    <<: *server
    command: /start-beat
    volumes:
      - celery-beat:/home/wger/beat/
    depends_on:
      web:
        condition: service_healthy

  powersync:
    image: docker.io/journeyapps/powersync-service:1.28.3@sha256:effc8cfae91dcb2d4b5767b3b0a795d933701aa957a81af2bfce7fb15c2f47b4
    command: ["start", "-r", "unified"]
    env_file: ${ALMOVA_ENV_FILE:-homolog.env}
    environment:
      POWERSYNC_CONFIG_PATH: /config/powersync.yaml
      PS_JWKS_URL: http://web:8000/api/v2/powersync-keys
    volumes:
      - ./config/powersync.yaml:/config/powersync.yaml:ro
      # The ALMOVA rules: prescription drafts stay off the patient's device
      - ../../powersync/sync_rules.yaml:/config/sync_rules.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  frontend:
    image: almova/web:${ALMOVA_TAG:-homolog}
    build:
      context: ../../../rp-web
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    env_file: ${ALMOVA_ENV_FILE:-homolog.env}
    environment:
      KINUTRI_API_URL: http://web:8000
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  nginx:
    image: docker.io/nginx:1.30.6-alpine3.24@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/wger/static:ro
      - media:/wger/media:ro
    ports:
      - "${ALMOVA_HTTP_PORT:-8080}:80"
    depends_on:
      - frontend
      - web
      - powersync
    logging: *logging
    restart: unless-stopped

  # Encrypted backup (extras/backup): docker compose run --rm backup, from the host's cron
  backup:
    image: almova/backup:${ALMOVA_TAG:-homolog}
    build:
      context: ../../..
      dockerfile: extras/docker/almova/backup/Dockerfile
    profiles: ["backup"]
    env_file: ${ALMOVA_ENV_FILE:-homolog.env}
    environment:
      PGHOST: db
      BACKUP_DIR: /backups
      BACKUP_MEDIA_DIRS: /home/wger/media /home/wger/private-media
    volumes:
      - media:/home/wger/media:ro
      - private-media:/home/wger/private-media:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  clamav-db:
  static:
  media:
  private-media:
  celery-beat:
