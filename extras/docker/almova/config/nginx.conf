# ALMOVA reverse proxy. Public: the web app (/, including its own /api/ routes),
# the REST API and login for the mobile app (/api/v2/, /allauth/), the sync
# service (/ps/) and the static files. wger's own pages and the Django admin
# stay internal (reach them over SSH or a VPN). TLS is terminated in front of
# this container (load balancer or a host proxy), which sets X-Forwarded-Proto.

# Access log without query strings: they can carry tokens (invitation links)
log_format almova '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_user_agent" "$http_x_forwarded_for"';

upstream almova_web { server web:8000; }
upstream almova_frontend { server frontend:3000; }
upstream almova_powersync { server powersync:8080; }

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_tokens off;
    access_log /var/log/nginx/access.log almova;
    # Chat videos go up to 50 MB
    client_max_body_size 60m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_http_version 1.1;

    location / {
        proxy_pass http://almova_frontend;
    }

    location ~ ^/(api/v2|allauth)/ {
        proxy_pass http://almova_web;
        proxy_read_timeout 300s;
    }

    location /ps/ {
        proxy_pass http://almova_powersync/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location /static/ {
        alias /wger/static/;
        add_header X-Content-Type-Options nosniff always;
    }

    # Exercise images and videos of the public library
    location /media/ {
        alias /wger/media/;
        add_header X-Content-Type-Options nosniff always;
    }
}
